# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Robbins' theorem on strongly connected orientations"
  description: >-
    A Lean 4 / Mathlib formalization of Robbins' theorem: a finite connected simple graph has a
    strongly connected orientation (a digraph with underlying graph G, never containing both
    u → v and v → u, in which every vertex reaches every other) if and only if no edge of it is a
    bridge. As a corollary, every finite 2-edge-connected graph on a nonempty vertex type has a
    strongly connected orientation. Mathlib has bridges, edge connectivity and digraphs, but not
    this theorem.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05C20", "05C40"]

sources:
  - title: "A Theorem on Graphs, with an Application to a Problem of Traffic Control"
    authors:
      - "H. E. Robbins"
    id: "doi:10.2307/2303897"
    type: "paper"
    location: "The American Mathematical Monthly 46 (1939), 281–283"
    relationship: "formalizes"
    note: "A connected graph has a strongly connected orientation iff it has no bridge."
    license: "all rights reserved"
    author_endorsement: "n/a"

status:
  scope: "Proved for every finite simple graph (vertex types in any universe)."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Statement design (checked by brute force on all graphs with six vertices), the
        Lean proofs (written and debugged locally with `lake build`, no autonomous prover), and
        the Palomar packaging, checked with `lake build` and `#print axioms` (Lean v4.35.0-rc3,
        Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "about two hours"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The result was chosen by the human author; the Lean proofs are AI-generated and mechanically
    verified (no `sorry`, axioms limited to propext, Classical.choice and Quot.sound, identical
    elaborated types for the Challenge/Solution pair).

fidelity:
  divergences: >-
    An orientation is a Mathlib `Digraph` D with `D.toSimpleGraphInclusive = G` (the symmetrized
    relation without loops is G) and no pair of opposite arcs; strong connectivity is
    `Relation.ReflTransGen D.Adj u v` for all u, v. The bridgeless condition quantifies over the
    edges of G, since Mathlib's `SimpleGraph.IsBridge` is defined for every unordered pair. The
    corollary uses `SimpleGraph.IsEdgeConnected 2` and assumes a nonempty vertex type, which
    together give connectivity.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: the agent
    compared the statements with Robbins' theorem, checked the encoding of orientations and strong
    connectivity, and confirmed by `lake build`, `#print axioms` and a comparison of the fully
    elaborated Challenge and Solution types that the proofs use no `sorry` and only propext,
    Classical.choice and Quot.sound. The author directed the work and approved the statements.
    No independent human mathematical review has been performed. The result is classical; no
    mathematical novelty is claimed.

alignment:
  namespace: "StrongOrientation"
  statements:
    - source: "Robbins (1939): strongly connected orientation iff bridgeless (connected graphs)"
      lean: "StrongOrientation.robbins"
      module: "Challenge"
      status: "proved"
    - source: "Every 2-edge-connected graph has a strongly connected orientation"
      lean: "StrongOrientation.exists_strong_orientation_of_isEdgeConnected_two"
      module: "Challenge"
      status: "proved"

acknowledgements: >-
  Mathlib and the Lean community.
